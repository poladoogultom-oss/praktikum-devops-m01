# Orkestrasi utama layanan Sentra dan Redis (Minggu 7)
services:
  app:
    build: .
    image: sentra:${APP_VERSION:-1.0.0}
    ports:
      - "${APP_PORT:-8080}:5000"
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      BUILD_ID: base-compose
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request as u, sys
          r = u.urlopen('http://127.0.0.1:5000/health')
          sys.exit(0 if r.status == 200 else 1)
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - sentra-net

  redis:
    image: redis:${REDIS_TAG:-7-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - sentra-net

  redis-cli:
    image: redis:${REDIS_TAG:-7-alpine}
    profiles:
      - tools
    command: redis-cli -h redis ping
    depends_on:
      - redis
    networks:
      - sentra-net

volumes:
  redis-data:

networks:
  sentra-net:
